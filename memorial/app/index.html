<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>디지털 추모관 · 기록하기</title>
<link rel="icon" href="/images/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f3f4f1;--paper:#fbfbf9;--ink:#1f2a2e;--muted:#5d6a6e;--line:#d7dbd6;--accent:#3f6b63;--accent-soft:#e2ebe7;--gold:#9a7b3c;--danger:#a3412f;
--display:"Gowun Batang",serif;--body:"Noto Sans KR",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#161b1d;--paper:#1d2427;--ink:#e7ebe8;--muted:#a2adaa;--line:#334044;--accent:#8cbfb2;--accent-soft:#24332f;--gold:#d1b073;--danger:#e08a78;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 var(--body);word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:860px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 64px max(16px,env(safe-area-inset-right,0px))}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:18px;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{font:700 20px var(--display);color:var(--ink);text-decoration:none}
.brand small{display:block;font:12px var(--body);color:var(--muted)}
h1,h2,h3{font-family:var(--display);line-height:1.35;margin:0 0 12px;text-wrap:balance}
h1{font-size:28px}h2{font-size:22px;margin-top:8px}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:20px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--paper);border:0;border-radius:6px;padding:10px 16px;font:500 15px var(--body);cursor:pointer;text-decoration:none}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:6px 12px;font-size:14px}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--danger)}
.btn.kakao{background:#FEE500;color:#191919;font-weight:700;padding:14px 22px;font-size:16px}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
input,textarea,select{width:100%;font:15px var(--body);padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font:500 15px var(--body);color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.list{display:grid;gap:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.thumbs figure{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;display:block}
.pill{font-size:12px;border-radius:999px;padding:2px 10px;border:1px solid var(--line);color:var(--muted)}
.pill.ok{color:var(--accent);border-color:var(--accent)}
.rec{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--danger);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.rec{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:6px;font-size:14px;max-width:90vw}
.portrait{width:160px;aspect-ratio:3/4;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:var(--accent-soft)}
.verse{border-left:3px solid var(--gold);padding:10px 14px;background:var(--paper);font-family:var(--display);margin:12px 0}
.ch{border-top:1px solid var(--line);padding:16px 0}
.ch .yr{color:var(--gold);font-weight:700;font-size:14px}
audio{width:100%;margin-top:8px}
.notice{background:var(--accent-soft);border-radius:6px;padding:12px 14px;font-size:14px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="#">디지털 추모관<small>가칭 · 여의도순복음춘천교회 · 시범 운영</small></a>
    <div class="row" id="authbox"></div>
  </header>
  <main id="main"><p class="muted">불러오는 중…</p></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const QUESTIONS=[
 '고향은 어디셨고, 어린 시절은 어떠셨어요?','부모님은 어떤 분이셨어요?','학교 다니던 시절 기억나는 일이 있으세요?',
 '배우자를 처음 만난 이야기를 들려주세요.','결혼하고 처음 살림은 어떠셨어요?','자녀가 태어났을 때 어떠셨어요?',
 '가장 힘들었던 때는 언제였고, 어떻게 이겨내셨어요?','처음 교회에 나가신 계기는 무엇이었어요?',
 '가장 좋아하시는 성경 말씀과 그 이유는요?','가장 좋아하시는 찬송은요?','살면서 가장 감사했던 일은 무엇이에요?',
 '자녀들에게 꼭 남기고 싶은 말씀은요?','손주들에게 하고 싶은 말씀은요?','어떤 사람으로 기억되고 싶으세요?'];
const VIS={private:'가족만 보기',church:'로그인한 교회 이용자',public:'전체 공개'};
let sb=null, cfg=null, session=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,8000)}
async function signed(path){if(!path)return '';const {data}=await sb.storage.from('memorial-media').createSignedUrl(path,3600);return data?.signedUrl||''}
async function api(name,body){const r=await fetch('/api/'+name,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('오류 '+r.status));return j}
function fmtDate(d){if(!d)return '';const [y,m,dd]=d.split('-');return `${y}. ${+m}. ${+dd}`}

async function boot(){
  try{cfg=await (await fetch('/api/config')).json()}catch{cfg={}}
  if(!cfg.supabaseUrl||!cfg.supabaseAnonKey){$('#main').innerHTML='<div class="card"><h2>준비 중입니다</h2><p class="muted">서버 연결 설정(Supabase)이 아직 끝나지 않았습니다. 관리자에게 문의해 주세요.</p><p><a class="btn ghost" href="/memorial/">샘플 화면 보기</a></p></div>';return}
  sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
  const {data}=await sb.auth.getSession();session=data.session;
  sb.auth.onAuthStateChange((_e,s)=>{session=s;renderAuth();route()});
  window.addEventListener('hashchange',route);renderAuth();route();
}
function renderAuth(){
  const b=$('#authbox');
  if(session){const n=session.user.user_metadata?.name||session.user.user_metadata?.full_name||'로그인됨';
    b.innerHTML=`<span class="muted">${esc(n)}님</span><button class="btn small ghost" id="logout">로그아웃</button>`;
    $('#logout').onclick=async()=>{await sb.auth.signOut();location.hash=''}}
  else b.innerHTML='';
}
function route(){
  const h=location.hash.slice(1);const [view,id]=h.split('-').length>5?[h.slice(0,h.indexOf('-')),h.slice(h.indexOf('-')+1)]:h.split(/-(.+)/);
  if(view==='view'&&id)return viewPage(id);
  if(!session)return loginPage();
  if(view==='new')return editInfo(null);
  if(view==='edit'&&id)return editPage(id);
  return homePage();
}

function loginPage(){
  $('#main').innerHTML=`<div class="card" style="text-align:center;padding:36px 20px">
    <h1>부모님의 이야기를 남겨 주세요</h1>
    <p class="muted" style="max-width:46ch;margin:0 auto 24px">카카오로 간편하게 시작하세요. 기록은 기본적으로 가족만 볼 수 있으며, 이용료는 없습니다.</p>
    <button class="btn kakao" id="kakao">카카오로 시작하기</button>
    <p class="muted" style="margin-top:20px"><a href="/memorial/">샘플 화면 먼저 보기</a></p></div>`;
  $('#kakao').onclick=()=>sb.auth.signInWithOAuth({provider:'kakao',options:{redirectTo:location.origin+'/memorial/app/'}});
}

async function homePage(){
  const uid=session.user.id;
  const {data:own}=await sb.from('memorials').select('id,name,title,birth_date,death_date,visibility,updated_at').eq('owner_id',uid).order('updated_at',{ascending:false});
  const {data:mem}=await sb.from('memorial_members').select('memorial_id,memorials(id,name,title,birth_date,death_date,visibility)').eq('user_id',uid);
  const list=[...(own||[]),...((mem||[]).map(x=>x.memorials).filter(Boolean))];
  $('#main').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:16px"><h1 style="margin:0">내 기록관</h1><a class="btn" href="#new">+ 새 기록관 만들기</a></div>
   ${list.length?'<div class="list">'+list.map(m=>`<div class="card row" style="justify-content:space-between">
     <div><h3 style="margin:0">${esc(m.name)} ${esc(m.title||'')}</h3><div class="muted">${fmtDate(m.birth_date)}${m.death_date?' ~ '+fmtDate(m.death_date):' · 생전 기록'} · ${VIS[m.visibility]}</div></div>
     <div class="row"><a class="btn small ghost" href="#view-${m.id}">보기</a><a class="btn small" href="#edit-${m.id}">기록하기</a></div></div>`).join('')+'</div>'
   :'<div class="card"><p>아직 만든 기록관이 없습니다.</p><p class="muted">부모님(또는 본인)의 기록관을 만들고, 질문에 말로 답하며 이야기를 남겨 보세요.</p></div>'}`;
}

async function editInfo(m){
  m=m||{visibility:'private'};
  const isNew=!m.id;
  const html=`<div class="card"><h2>${isNew?'새 기록관 만들기':'기본 정보'}</h2>
   <div class="grid2">
    <div><label for="f-name">성함 *</label><input id="f-name" value="${esc(m.name)}" maxlength="40"></div>
    <div><label for="f-title">직분·호칭</label><input id="f-title" value="${esc(m.title)}" placeholder="예: 권사, 장로, 성도"></div>
    <div><label for="f-birth">태어나신 날</label><input id="f-birth" type="date" value="${esc(m.birth_date)}"></div>
    <div><label for="f-death">소천하신 날 (생전 기록이면 비워 두세요)</label><input id="f-death" type="date" value="${esc(m.death_date)}"></div>
    <div><label for="f-home">고향</label><input id="f-home" value="${esc(m.hometown)}"></div>
    <div><label for="f-hymn">애송 찬송</label><input id="f-hymn" value="${esc(m.hymn)}"></div>
   </div>
   <label for="f-verse">좋아하시는 말씀</label><textarea id="f-verse" style="min-height:60px">${esc(m.verse)}</textarea>
   <label for="f-vref">말씀 출처</label><input id="f-vref" value="${esc(m.verse_ref)}" placeholder="예: 디모데후서 4:7">
   <label for="f-intro">짧은 소개</label><textarea id="f-intro">${esc(m.intro)}</textarea>
   <label for="f-vis">공개 범위</label><select id="f-vis">${Object.entries(VIS).map(([k,v])=>`<option value="${k}" ${m.visibility===k?'selected':''}>${v}</option>`).join('')}</select>
   <label for="f-portrait">영정·대표 사진</label><input id="f-portrait" type="file" accept="image/*">
   ${isNew?`<label style="display:flex;gap:8px;align-items:flex-start;color:var(--ink)"><input type="checkbox" id="f-consent" style="width:auto;margin-top:6px"> 본인 또는 가족으로서 이 기록을 남기는 데 동의하며, 녹음과 사진을 교회 디지털 추모관에 보관하는 것에 동의합니다. 언제든 내려받거나 삭제를 요청할 수 있습니다.</label>`:''}
   <div class="row" style="margin-top:16px"><button class="btn" id="save">${isNew?'만들기':'저장'}</button>${isNew?'<a class="btn ghost" href="#">취소</a>':''}</div></div>`;
  if(isNew)$('#main').innerHTML=html;else $('#tab').innerHTML=html;
  $('#save').onclick=async()=>{
    const name=$('#f-name').value.trim();if(!name)return toast('성함을 입력해 주세요.');
    if(isNew&&!$('#f-consent').checked)return toast('동의에 체크해 주세요.');
    const row={name,title:$('#f-title').value.trim()||null,birth_date:$('#f-birth').value||null,death_date:$('#f-death').value||null,
      hometown:$('#f-home').value.trim()||null,hymn:$('#f-hymn').value.trim()||null,verse:$('#f-verse').value.trim()||null,
      verse_ref:$('#f-vref').value.trim()||null,intro:$('#f-intro').value.trim()||null,visibility:$('#f-vis').value,updated_at:new Date().toISOString()};
    $('#save').disabled=true;
    try{
      let id=m.id;
      if(isNew){row.owner_id=session.user.id;row.consent_at=new Date().toISOString();
        const {data,error}=await sb.from('memorials').insert(row).select('id').single();if(error)throw error;id=data.id}
      else{const {error}=await sb.from('memorials').update(row).eq('id',id);if(error)throw error}
      const file=$('#f-portrait').files[0];
      if(file){const p=`${id}/portrait-${Date.now()}.${(file.name.split('.').pop()||'jpg').toLowerCase()}`;
        const {error:e1}=await sb.storage.from('memorial-media').upload(p,file,{upsert:true});if(e1)throw e1;
        await sb.from('memorials').update({portrait_path:p}).eq('id',id)}
      toast('저장했습니다.');location.hash='edit-'+id;if(!isNew)editPage(id);
    }catch(e){toast('저장하지 못했습니다: '+e.message);alert('저장하지 못했습니다.\n'+e.message)}finally{const b=$('#save');if(b)b.disabled=false}
  };
}

async function editPage(id){
  const {data:m,error}=await sb.from('memorials').select('*').eq('id',id).single();
  if(error||!m){$('#main').innerHTML='<div class="card">기록관을 찾을 수 없거나 권한이 없습니다.</div>';return}
  $('#main').innerHTML=`<div class="row" style="justify-content:space-between"><h1 style="margin:0">${esc(m.name)} ${esc(m.title||'')}</h1><a class="btn small ghost" href="#view-${id}">추모관 보기</a></div>
   <p class="muted">${VIS[m.visibility]} · <a href="#">내 기록관 목록</a></p>
   <div class="tabs" role="tablist">${['녹음','생애의 장','사진','기본 정보'].map((t,i)=>`<button role="tab" data-t="${i}" aria-selected="${i===0}">${t}</button>`).join('')}</div><div id="tab"></div>`;
  const tabs=[()=>tabRec(m),()=>tabChapters(m),()=>tabPhotos(m),()=>editInfo(m)];
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));tabs[+b.dataset.t]()});
  tabRec(m);
}

let mediaRec=null, chunks=[], recStart=0;
async function tabRec(m){
  const {data:recs}=await sb.from('recordings').select('*').eq('memorial_id',m.id).order('created_at');
  const done=new Set((recs||[]).map(r=>r.question));
  const next=QUESTIONS.find(q=>!done.has(q))||'';
  $('#tab').innerHTML=`<div class="card"><h2>질문에 말로 답하기</h2>
    <p class="muted">질문을 고르고 녹음 버튼을 누른 뒤 편하게 이야기하세요. 휴대폰 녹음 파일을 올려도 됩니다.</p>
    <label for="q">질문</label><select id="q">${QUESTIONS.map(q=>`<option ${q===next?'selected':''}>${esc(q)}</option>`).join('')}<option value="__custom">직접 질문 쓰기…</option></select>
    <input id="qc" placeholder="질문을 입력하세요" hidden style="margin-top:8px">
    <div class="row" style="margin-top:14px"><button class="btn" id="recBtn">● 녹음 시작</button><span id="recState" class="muted"></span>
      <label class="btn ghost" style="margin:0;color:var(--accent)">파일 올리기<input type="file" id="upAudio" accept="audio/*" hidden></label></div></div>
    <h2>남긴 녹음 (${(recs||[]).length})</h2><div class="list" id="recList"></div>`;
  $('#q').onchange=()=>{$('#qc').hidden=$('#q').value!=='__custom'};
  const question=()=>$('#q').value==='__custom'?$('#qc').value.trim():$('#q').value;
  async function saveAudio(blob,ext,dur){
    const q=question();if(!q)return toast('질문을 입력해 주세요.');
    const p=`${m.id}/rec-${Date.now()}.${ext}`;
    const {error}=await sb.storage.from('memorial-media').upload(p,blob,{contentType:blob.type||'audio/webm'});if(error)return toast('업로드 실패: '+error.message);
    const {data:row,error:e2}=await sb.from('recordings').insert({memorial_id:m.id,question:q,audio_path:p,duration_sec:dur||null}).select().single();if(e2)return toast(e2.message);
    toast('녹음을 저장했습니다.');
    if(cfg.sttEnabled){try{toast('받아쓰는 중…');await api('transcribe',{recording_id:row.id});toast('받아쓰기를 마쳤습니다.')}catch(e){toast(e.message)}}
    tabRec(m);
  }
  $('#recBtn').onclick=async()=>{
    if(mediaRec&&mediaRec.state==='recording'){mediaRec.stop();return}
    try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];
      mediaRec=new MediaRecorder(stream);mediaRec.ondataavailable=e=>chunks.push(e.data);
      mediaRec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const type=mediaRec.mimeType||'audio/webm';
        const blob=new Blob(chunks,{type});$('#recBtn').textContent='● 녹음 시작';$('#recState').textContent='';
        saveAudio(blob,type.includes('mp4')?'m4a':'webm',Math.round((Date.now()-recStart)/1000))};
      mediaRec.start();recStart=Date.now();$('#recBtn').textContent='■ 녹음 끝내기';$('#recState').innerHTML='<span class="rec"></span> 녹음 중';
    }catch(e){toast('마이크를 사용할 수 없습니다. 브라우저 권한을 확인하거나 파일 올리기를 이용하세요.')}
  };
  $('#upAudio').onchange=e=>{const f=e.target.files[0];if(f)saveAudio(f,(f.name.split('.').pop()||'m4a').toLowerCase(),null)};
  const list=$('#recList');
  for(const r of recs||[]){
    const url=await signed(r.audio_path);
    const d=document.createElement('div');d.className='card';
    d.innerHTML=`<div class="row" style="justify-content:space-between"><b>${esc(r.question)}</b><span class="pill ${r.transcript?'ok':''}">${r.transcript?'받아쓰기 완료':'받아쓰기 전'}</span></div>
      <audio controls preload="none" src="${esc(url)}"></audio>
      <label>받아쓴 내용 (틀린 글자는 고쳐 주세요)</label><textarea>${esc(r.transcript)}</textarea>
      <div class="row" style="margin-top:8px"><button class="btn small" data-a="save">고친 내용 저장</button>${cfg.sttEnabled?'<button class="btn small ghost" data-a="stt">AI로 받아쓰기</button>':''}<button class="btn small danger" data-a="del">삭제</button></div>`;
    d.querySelector('[data-a=save]').onclick=async()=>{const {error}=await sb.from('recordings').update({transcript:d.querySelector('textarea').value}).eq('id',r.id);toast(error?error.message:'저장했습니다.')};
    const stt=d.querySelector('[data-a=stt]');if(stt)stt.onclick=async()=>{stt.disabled=true;stt.textContent='받아쓰는 중…';try{const j=await api('transcribe',{recording_id:r.id});d.querySelector('textarea').value=j.transcript;toast('받아쓰기를 마쳤습니다.')}catch(e){toast(e.message)}stt.disabled=false;stt.textContent='AI로 받아쓰기'};
    d.querySelector('[data-a=del]').onclick=async()=>{if(!d._c){d._c=1;toast('한 번 더 누르면 삭제됩니다.');return}
      await sb.storage.from('memorial-media').remove([r.audio_path]);await sb.from('recordings').delete().eq('id',r.id);tabRec(m)};
    list.appendChild(d);
  }
}

async function tabChapters(m){
  const {data:chs}=await sb.from('chapters').select('*').eq('memorial_id',m.id).order('sort');
  $('#tab').innerHTML=`<div class="card"><h2>생애의 장</h2>
   <p class="muted">받아쓴 녹음을 바탕으로 AI가 자서전 초안을 만듭니다. 고인이 하지 않은 말은 넣지 않도록 되어 있지만, 가족이 꼭 읽고 고친 뒤 <b>확인</b>을 눌러 주세요. 확인한 장만 추모관에 보입니다.</p>
   <div class="row">${cfg.aiEnabled?'<button class="btn" id="compose">AI로 자서전 초안 만들기</button>':''}<button class="btn ghost" id="addch">+ 직접 쓰기</button></div></div>
   <div class="list" id="chList"></div>`;
  if($('#compose'))$('#compose').onclick=async()=>{const b=$('#compose');b.disabled=true;b.textContent='정리하는 중… (1분 정도 걸립니다)';
    try{const j=await api('compose',{memorial_id:m.id});toast(`${j.chapters.length}개 장을 만들었습니다.`);tabChapters(m)}catch(e){toast(e.message);b.disabled=false;b.textContent='AI로 자서전 초안 만들기'}};
  $('#addch').onclick=async()=>{await sb.from('chapters').insert({memorial_id:m.id,title:'새 장',sort:(chs?.length||0)*10});tabChapters(m)};
  const list=$('#chList');
  for(const c of chs||[]){const d=document.createElement('div');d.className='card';
    d.innerHTML=`<div class="grid2"><div><label>시기</label><input data-f="period" value="${esc(c.period)}" placeholder="예: 1938 ~ 1956"></div><div><label>제목</label><input data-f="title" value="${esc(c.title)}"></div></div>
      <label>본문</label><textarea data-f="body">${esc(c.body)}</textarea>
      <div class="row" style="margin-top:8px"><label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--ink)"><input type="checkbox" data-f="approved" ${c.approved?'checked':''} style="width:auto"> 가족 확인 완료</label>
      <button class="btn small" data-a="save">저장</button><button class="btn small danger" data-a="del">삭제</button></div>`;
    d.querySelector('[data-a=save]').onclick=async()=>{const u={};d.querySelectorAll('[data-f]').forEach(i=>u[i.dataset.f]=i.type==='checkbox'?i.checked:i.value);const {error}=await sb.from('chapters').update(u).eq('id',c.id);toast(error?error.message:'저장했습니다.')};
    d.querySelector('[data-a=del]').onclick=async()=>{if(!d._c){d._c=1;toast('한 번 더 누르면 삭제됩니다.');return}await sb.from('chapters').delete().eq('id',c.id);tabChapters(m)};
    list.appendChild(d)}
}

async function tabPhotos(m){
  const {data:ps}=await sb.from('photos').select('*').eq('memorial_id',m.id).order('sort');
  $('#tab').innerHTML=`<div class="card"><h2>사진</h2><p class="muted">여러 장을 한 번에 고를 수 있습니다. 올린 뒤 연도와 설명을 적어 주세요.</p>
    <input type="file" id="upPh" accept="image/*" multiple></div><div class="thumbs" id="phList"></div>`;
  $('#upPh').onchange=async e=>{const files=[...e.target.files];toast(`${files.length}장 올리는 중…`);
    for(const [i,f] of files.entries()){const p=`${m.id}/photo-${Date.now()}-${i}.${(f.name.split('.').pop()||'jpg').toLowerCase()}`;
      const {error}=await sb.storage.from('memorial-media').upload(p,f);if(error){toast(error.message);continue}
      await sb.from('photos').insert({memorial_id:m.id,path:p,sort:(ps?.length||0)+i})}
    toast('사진을 올렸습니다.');tabPhotos(m)};
  const list=$('#phList');
  for(const p of ps||[]){const url=await signed(p.path);const f=document.createElement('figure');
    f.innerHTML=`<img src="${esc(url)}" alt="${esc(p.caption||'사진')}"><input data-f="year" value="${esc(p.year)}" placeholder="연도" style="margin-top:6px"><input data-f="caption" value="${esc(p.caption)}" placeholder="설명" style="margin-top:6px">
      <div class="row" style="margin-top:6px"><button class="btn small">저장</button><button class="btn small danger">삭제</button></div>`;
    const [s,del]=f.querySelectorAll('button');
    s.onclick=async()=>{const {error}=await sb.from('photos').update({year:f.querySelector('[data-f=year]').value,caption:f.querySelector('[data-f=caption]').value}).eq('id',p.id);toast(error?error.message:'저장했습니다.')};
    del.onclick=async()=>{if(!f._c){f._c=1;toast('한 번 더 누르면 삭제됩니다.');return}await sb.storage.from('memorial-media').remove([p.path]);await sb.from('photos').delete().eq('id',p.id);tabPhotos(m)};
    list.appendChild(f)}
}

async function viewPage(id){
  const {data:m}=await sb.from('memorials').select('*').eq('id',id).maybeSingle();
  if(!m){$('#main').innerHTML=`<div class="card"><h2>볼 수 없는 추모관입니다</h2><p class="muted">비공개이거나 로그인이 필요합니다.</p>${session?'':'<button class="btn kakao" id="kakao">카카오로 로그인</button>'}</div>`;
    if($('#kakao'))$('#kakao').onclick=()=>sb.auth.signInWithOAuth({provider:'kakao',options:{redirectTo:location.href}});return}
  const [{data:chs},{data:ps},{data:recs},{data:gb}]=await Promise.all([
    sb.from('chapters').select('*').eq('memorial_id',id).eq('approved',true).order('sort'),
    sb.from('photos').select('*').eq('memorial_id',id).order('sort'),
    sb.from('recordings').select('id,question,audio_path,recorded_on').eq('memorial_id',id),
    sb.from('guestbook').select('*').eq('memorial_id',id).order('created_at')]);
  const recMap=Object.fromEntries((recs||[]).map(r=>[r.id,r]));
  const portrait=await signed(m.portrait_path);
  const age=m.birth_date&&m.death_date?Math.floor((new Date(m.death_date)-new Date(m.birth_date))/31557600000):null;
  $('#main').innerHTML=`<div class="row" style="align-items:flex-start;gap:24px">
     ${portrait?`<img class="portrait" src="${esc(portrait)}" alt="${esc(m.name)}">`:'<div class="portrait"></div>'}
     <div style="flex:1;min-width:220px"><h1>${esc(m.name)} ${esc(m.title||'')}</h1>
      <div class="muted">${fmtDate(m.birth_date)}${m.death_date?' ~ '+fmtDate(m.death_date):''}${age?` · 향년 ${age}세`:''}${m.hometown?' · '+esc(m.hometown):''}</div>
      ${m.verse?`<div class="verse">"${esc(m.verse)}"<div class="muted" style="font-family:var(--body)">${esc(m.verse_ref||'')}</div></div>`:''}
      ${m.hymn?`<div class="muted">애송 찬송 · ${esc(m.hymn)}</div>`:''}${m.intro?`<p>${esc(m.intro)}</p>`:''}</div></div>
   <h2 style="margin-top:32px">생애의 장</h2><div id="chs">${(chs||[]).length?'':'<p class="muted">아직 공개된 장이 없습니다.</p>'}</div>
   <h2 style="margin-top:32px">사진</h2><div class="thumbs" id="phs"></div>
   ${(recs||[]).length&&cfg.aiEnabled&&session?`<h2 style="margin-top:32px">여쭤보기</h2><div class="card"><p class="muted">궁금한 것을 적으면 생전에 남기신 실제 녹음 가운데 가장 가까운 답을 찾아 들려드립니다. 새로 지어낸 말은 없습니다.</p>
     <div class="row"><input id="askq" placeholder="예: 힘드실 때 어떻게 버티셨어요?" style="flex:1"><button class="btn" id="askb">찾기</button></div><div id="aska"></div></div>`:''}
   <h2 style="margin-top:32px">추모의 글</h2><div class="list" id="gb"></div>
   ${session?`<div class="card" style="margin-top:12px"><label for="gbn">이름</label><input id="gbn" maxlength="20" value="${esc(session.user.user_metadata?.name||'')}"><label for="gbt">남기실 말씀</label><textarea id="gbt" maxlength="2000"></textarea><button class="btn" id="gbs" style="margin-top:10px">글 남기기</button></div>`:'<p class="muted">로그인하면 추모의 글을 남길 수 있습니다.</p>'}`;
  const chEl=$('#chs');
  for(const c of chs||[]){const r=recMap[c.recording_id];const d=document.createElement('div');d.className='ch';
    d.innerHTML=`<div class="yr">${esc(c.period||'')}</div><h3>${esc(c.title)}</h3><p>${esc(c.body||'').replace(/\n/g,'<br>')}</p>`;
    if(r){const a=document.createElement('audio');a.controls=true;a.preload='none';a.src=await signed(r.audio_path);d.appendChild(a)}
    chEl.appendChild(d)}
  const phEl=$('#phs');for(const p of ps||[]){const f=document.createElement('figure');f.innerHTML=`<img src="${esc(await signed(p.path))}" alt="${esc(p.caption||'')}"><figcaption class="muted">${esc([p.year,p.caption].filter(Boolean).join(' · '))}</figcaption>`;phEl.appendChild(f)}
  const gbEl=$('#gb');(gb||[]).forEach(g=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<b>${esc(g.author_name)}</b> <span class="muted">${new Date(g.created_at).toLocaleDateString('ko-KR')}</span><p style="margin:6px 0 0">${esc(g.body)}</p>`;gbEl.appendChild(d)});
  if($('#gbs'))$('#gbs').onclick=async()=>{const body=$('#gbt').value.trim();if(!body)return;
    const {error}=await sb.from('guestbook').insert({memorial_id:id,author_id:session.user.id,author_name:$('#gbn').value.trim()||'익명',body});
    if(error)toast(error.message);else viewPage(id)};
  if($('#askb'))$('#askb').onclick=async()=>{const q=$('#askq').value.trim();if(!q)return;$('#aska').innerHTML='<p class="muted">찾는 중…</p>';
    try{const j=await api('ask',{memorial_id:id,question:q});const r=recMap[j.recording_id];
      $('#aska').innerHTML=r?`<div class="notice" style="margin-top:12px"><b>${esc(r.question)}</b><div class="muted">${esc(r.recorded_on||'')} 녹음</div></div>`:'<p class="muted" style="margin-top:12px">이 질문에 맞는 녹음을 찾지 못했습니다.</p>';
      if(r){const a=document.createElement('audio');a.controls=true;a.src=await signed(r.audio_path);$('#aska').appendChild(a)}}
    catch(e){$('#aska').innerHTML=`<p class="muted">${esc(e.message)}</p>`}};
}
boot();
</script>
</body>
</html>
