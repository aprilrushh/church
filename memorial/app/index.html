<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>디지털 추모관 · 기록하기</title>
<link rel="icon" href="/images/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6f3ee;--paper:#fdfbf8;--ink:#2a2724;--muted:#6f6860;--line:#e3ddd3;--hair:#d9cfbf;--accent:#3b4a47;--accent-soft:#eeeae3;--gold:#a88a55;--gold-soft:#efe6d6;--danger:#9c4a3c;
--display:"Nanum Myeongjo","Gowun Batang",serif;--body:"Pretendard","Noto Sans KR",system-ui,sans-serif;--shadow:0 1px 2px rgba(60,45,30,.04),0 8px 28px rgba(60,45,30,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#161514;--paper:#1e1c1a;--ink:#ece7df;--muted:#aaa196;--line:#33302c;--hair:#4a4339;--accent:#c9d3cf;--accent-soft:#26241f;--gold:#cdb07a;--gold-soft:#2c2619;--danger:#e09583;--shadow:none;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 var(--body);letter-spacing:-.005em;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:820px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 80px max(16px,env(safe-area-inset-right,0px))}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:22px;margin-bottom:32px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none}
.brand .mark{width:30px;height:30px;flex:none;color:var(--gold)}
.brand b{display:block;font:700 19px/1.2 var(--display);letter-spacing:.06em}
.brand small{display:block;font:12px/1.4 var(--body);color:var(--muted);letter-spacing:.04em;margin-top:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.4;margin:0 0 12px;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px}h2{font-size:21px;margin-top:8px}h3{font-size:18px}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:28px;margin-bottom:18px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--paper);border:1px solid var(--accent);border-radius:999px;padding:10px 22px;font:500 15px var(--body);letter-spacing:.02em;cursor:pointer;text-decoration:none;transition:background .2s,color .2s,border-color .2s}
.btn:hover{background:var(--ink);border-color:var(--ink)}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--hair)}
.btn.ghost:hover{border-color:var(--accent);background:var(--accent-soft)}
.btn.small{padding:6px 16px;font-size:14px}
.btn.danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.btn.kakao{background:#FEE500;border-color:#FEE500;color:#191919;font-weight:700;padding:14px 30px;font-size:16px}
.btn.kakao:hover{background:#f5dc00}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
label{display:block;font-size:13px;color:var(--muted);margin:16px 0 6px;letter-spacing:.03em}
input,textarea,select{width:100%;font:15px var(--body);padding:11px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);transition:border-color .2s,background .2s}
input:focus,textarea:focus,select:focus{border-color:var(--gold);background:var(--paper);outline:none}
input[type=file]{padding:9px;background:var(--paper)}
textarea{min-height:96px;resize:vertical;line-height:1.7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:12px 16px;font:500 15px var(--body);color:var(--muted);cursor:pointer;letter-spacing:.02em}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--gold)}
.list{display:grid;gap:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.thumbs figure{margin:0;background:var(--paper);border:1px solid var(--line);padding:10px 10px 6px;box-shadow:var(--shadow)}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;display:block;filter:saturate(.92)}
.thumbs figcaption{text-align:center;padding-top:6px}
.pill{font-size:12px;border-radius:999px;padding:2px 10px;border:1px solid var(--line);color:var(--muted)}
.pill.ok{color:var(--gold);border-color:var(--gold)}
.rec{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--danger);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.rec{animation:none}*{transition:none!important}}
.toast{position:fixed;z-index:1000;left:50%;top:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:999px;font-size:15px;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.notice{background:var(--gold-soft);border-radius:4px;padding:14px 16px;font-size:14px}
audio{width:100%;margin-top:10px;height:40px}
/* 추모관 보기 */
.memorial{text-align:center;padding:16px 0 8px}
.memorial .cross{width:22px;height:22px;color:var(--gold);margin:0 auto 22px;display:block}
.frame{display:inline-block;padding:10px;border:1px solid var(--hair);background:var(--paper);box-shadow:var(--shadow);margin-bottom:26px}
.frame .portrait{display:block;width:200px;aspect-ratio:3/4;object-fit:cover;background:var(--accent-soft);filter:saturate(.9)}
.frame.empty .portrait{display:grid;place-items:center;color:var(--hair)}
.memorial .eyebrow{font-size:13px;letter-spacing:.3em;color:var(--gold);margin-bottom:10px}
.memorial h1{font-size:36px;letter-spacing:.12em;margin-bottom:6px}
.memorial h1 small{font-size:18px;letter-spacing:.06em;color:var(--muted);margin-left:6px;font-weight:400}
.memorial .dates{font-family:var(--display);color:var(--muted);letter-spacing:.08em}
.memorial .rest{margin-top:14px;font-family:var(--display);font-size:15px;color:var(--muted)}
.verse{max-width:34em;margin:30px auto 0;padding:22px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font:400 18px/1.9 var(--display);color:var(--ink)}
.verse cite{display:block;margin-top:8px;font:13px var(--body);font-style:normal;color:var(--gold);letter-spacing:.08em}
.intro{max-width:34em;margin:24px auto 0;color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:28px;text-align:left}
.facts div{background:var(--paper);border:1px solid var(--line);padding:16px 18px;white-space:pre-line;font-size:15px}
.facts b{display:block;font:700 13px var(--body);color:var(--gold);letter-spacing:.12em;margin-bottom:6px}
.sec{text-align:center;margin:64px 0 26px}
.sec h2{display:inline-flex;align-items:center;gap:16px;font-size:20px;letter-spacing:.2em;margin:0}
.sec h2:before,.sec h2:after{content:"";width:48px;height:1px;background:var(--hair)}
.sec p{margin:8px 0 0}
.timeline{position:relative;margin-left:8px;padding-left:28px;border-left:1px solid var(--hair)}
.ch{position:relative;padding:4px 0 30px}
.ch:before{content:"";position:absolute;left:-33px;top:12px;width:9px;height:9px;border-radius:50%;background:var(--paper);border:1px solid var(--gold)}
.ch .yr{color:var(--gold);font-weight:500;font-size:13px;letter-spacing:.12em}
.ch h3{margin:2px 0 8px}
.ch p{margin:0}
.letter{background:var(--paper);border:1px solid var(--line);padding:20px 22px;box-shadow:var(--shadow)}
.letter p{margin:0 0 10px;font-family:var(--display);line-height:1.9}
.letter .from{font-size:13px;color:var(--muted);text-align:right}
.hero-login{text-align:center;padding:56px 24px}
.hero-login .cross{width:26px;height:26px;color:var(--gold);margin:0 auto 22px;display:block}
.hero-login h1{font-size:30px;letter-spacing:.06em}
@media (max-width:600px){.grid2{grid-template-columns:1fr}.card{padding:20px}.memorial h1{font-size:30px}.frame .portrait{width:170px}h1{font-size:26px}}

/* 방(공간) 느낌: 문살 바탕 + 이중 테두리 액자 + 모서리 문양 + 아치형 감실 */
body{background-color:var(--bg);background-image:
 repeating-linear-gradient(0deg,transparent 0 47px,color-mix(in srgb,var(--hair) 35%,transparent) 47px 48px),
 repeating-linear-gradient(90deg,transparent 0 47px,color-mix(in srgb,var(--hair) 35%,transparent) 47px 48px);background-attachment:fixed}
.room{position:relative;background:var(--paper);padding:56px 40px 48px;margin:8px 0 24px;
 border:1px solid var(--gold);outline:1px solid var(--hair);outline-offset:-10px;box-shadow:0 2px 0 var(--paper),0 18px 60px rgba(60,45,30,.10)}
.room .corner{position:absolute;width:46px;height:46px;color:var(--gold);pointer-events:none}
.room .corner.tl{top:16px;left:16px}.room .corner.tr{top:16px;right:16px;transform:scaleX(-1)}
.room .corner.bl{bottom:16px;left:16px;transform:scaleY(-1)}.room .corner.br{bottom:16px;right:16px;transform:scale(-1,-1)}
.room .lintel{display:block;width:min(360px,70%);height:18px;margin:-30px auto 26px;color:var(--gold)}
.niche{display:inline-block;padding:14px 14px 18px;border:1px solid var(--hair);border-radius:140px 140px 4px 4px;
 background:radial-gradient(ellipse at 50% 30%,color-mix(in srgb,var(--gold-soft) 90%,transparent),transparent 70%);margin-bottom:24px}
.niche .frame{border-radius:120px 120px 2px 2px;overflow:hidden;margin:0;padding:8px;border-color:var(--gold)}
.niche .frame .portrait{border-radius:112px 112px 0 0}
.room .floor{display:block;width:min(420px,80%);height:16px;margin:56px auto 0;color:var(--gold)}
@media (max-width:600px){.room{padding:44px 18px 36px;outline-offset:-7px}.room .corner{width:30px;height:30px}.room .corner.tl,.room .corner.tr{top:10px}.room .corner.bl,.room .corner.br{bottom:10px}.room .corner.tl,.room .corner.bl{left:10px}.room .corner.tr,.room .corner.br{right:10px}}

.sayings{display:grid;gap:16px}
.saying{position:relative;background:var(--paper);border:1px solid var(--line);padding:26px 28px 18px 56px;box-shadow:var(--shadow)}
.saying:before{content:"\201C";position:absolute;left:18px;top:6px;font:700 54px/1 var(--display);color:var(--gold);opacity:.7}
.saying p{margin:0;font:400 18px/1.9 var(--display)}
.saying .ctx{margin-top:8px;font-size:13px;color:var(--muted);text-align:right}
.thumbs button{all:unset;cursor:zoom-in;display:block}
.lightbox{position:fixed;inset:0;z-index:900;background:rgba(20,18,16,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.lightbox img{max-width:100%;max-height:82vh;object-fit:contain;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.lightbox .cap{color:#e9e2d6;margin-top:14px;font-family:var(--display);text-align:center}
.lightbox .nav{position:absolute;top:50%;transform:translateY(-50%);background:none;border:1px solid rgba(255,255,255,.35);color:#fff;width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer}
.lightbox .prev{left:16px}.lightbox .next{right:16px}
.lightbox .close{position:absolute;top:16px;right:16px;background:none;border:0;color:#fff;font-size:28px;cursor:pointer}
.memories{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.memory{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.memory img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in}
.memory .in{padding:16px 18px}
.memory .yr{font-size:12px;color:var(--gold);letter-spacing:.12em}
.memory p{margin:4px 0 10px;font-family:var(--display);line-height:1.85}
.memory .from,.letter .from{font-size:13px;color:var(--muted);text-align:right}
.seg{display:inline-flex;border:1px solid var(--hair);border-radius:999px;padding:3px;margin-bottom:6px}
.seg button{border:0;background:none;padding:8px 18px;border-radius:999px;font:500 14px var(--body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--paper)}
details.opt{border:1px solid var(--line);border-radius:4px;padding:12px 16px;margin:16px 0;background:var(--bg)}
details.opt summary{cursor:pointer;font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="#"><svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M12 2.5v19M6 8.5h12"/></svg><span><b>디지털 추모관</b><small>여의도순복음춘천교회 · 가칭 · 시범 운영</small></span></a>
    <div class="row" id="authbox"></div>
  </header>
  <main id="main"><p class="muted">불러오는 중…</p></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const QUESTIONS=[
 '고향은 어디셨고, 어린 시절은 어떠셨어요?','부모님은 어떤 분이셨어요?','학교 다니던 시절 기억나는 일이 있으세요?',
 '배우자를 처음 만난 이야기를 들려주세요.','결혼하고 처음 살림은 어떠셨어요?','자녀가 태어났을 때 어떠셨어요?',
 '가장 힘들었던 때는 언제였고, 어떻게 이겨내셨어요?','처음 교회에 나가신 계기는 무엇이었어요?',
 '가장 좋아하시는 성경 말씀과 그 이유는요?','가장 좋아하시는 찬송은요?','살면서 가장 감사했던 일은 무엇이에요?',
 '자녀들에게 꼭 남기고 싶은 말씀은요?','손주들에게 하고 싶은 말씀은요?','어떤 사람으로 기억되고 싶으세요?'];
const CROSS='<svg class="cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M12 2.5v19M6 8.5h12"/></svg>';
const CORNER='<svg class="corner %s" viewBox="0 0 46 46" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M1 45V9a8 8 0 0 1 8-8h36"/><path d="M6 45V14a8 8 0 0 1 8-8h31"/><path d="M14 14c4 0 6 2 6 6M14 14c0 4 2 6 6 6"/><circle cx="14" cy="14" r="1.6" fill="currentColor"/></svg>';
const LINTEL='<svg class="%s" viewBox="0 0 360 18" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M0 9h150M210 9h150"/><path d="M160 9c6-8 14-8 20 0c6 8 14 8 20 0c-6-8-14-8-20 0c-6 8-14 8-20 0z"/><circle cx="150" cy="9" r="1.5" fill="currentColor"/><circle cx="210" cy="9" r="1.5" fill="currentColor"/></svg>';
const VIS={private:'가족만 보기',church:'로그인한 교회 이용자',public:'전체 공개'};
let sb=null, cfg=null, session=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,8000)}
async function signed(path){if(!path)return '';const {data}=await sb.storage.from('memorial-media').createSignedUrl(path,3600);return data?.signedUrl||''}
async function api(name,body){const r=await fetch('/api/'+name,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('오류 '+r.status));return j}
function fmtDate(d){if(!d)return '';const [y,m,dd]=d.split('-');return `${y}. ${+m}. ${+dd}`}

async function boot(){
  try{cfg=await (await fetch('/api/config')).json()}catch{cfg={}}
  if(!cfg.supabaseUrl||!cfg.supabaseAnonKey){$('#main').innerHTML='<div class="card"><h2>준비 중입니다</h2><p class="muted">서버 연결 설정(Supabase)이 아직 끝나지 않았습니다. 관리자에게 문의해 주세요.</p><p><a class="btn ghost" href="/memorial/">샘플 화면 보기</a></p></div>';return}
  sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
  const {data}=await sb.auth.getSession();session=data.session;
  sb.auth.onAuthStateChange((_e,s)=>{session=s;renderAuth();route()});
  window.addEventListener('hashchange',route);renderAuth();route();
}
function renderAuth(){
  const b=$('#authbox');
  if(session){const n=session.user.user_metadata?.name||session.user.user_metadata?.full_name||'로그인됨';
    b.innerHTML=`<span class="muted">${esc(n)}님</span><button class="btn small ghost" id="logout">로그아웃</button>`;
    $('#logout').onclick=async()=>{await sb.auth.signOut();location.hash=''}}
  else b.innerHTML='';
}
function route(){
  const h=location.hash.slice(1);const [view,id]=h.split('-').length>5?[h.slice(0,h.indexOf('-')),h.slice(h.indexOf('-')+1)]:h.split(/-(.+)/);
  if(view==='view'&&id)return viewPage(id);
  if(!session)return loginPage();
  if(view==='new')return editInfo(null);
  if(view==='edit'&&id)return editPage(id);
  return homePage();
}

function loginPage(){
  $('#main').innerHTML=`<div class="card hero-login">${CROSS}
    <h1>사랑하는 분의 삶을<br>정성껏 남겨 드립니다</h1>
    <p class="muted" style="max-width:46ch;margin:0 auto 24px">목소리와 사진, 걸어오신 믿음의 길을 가족과 함께 기록하세요. 기록은 기본적으로 가족만 볼 수 있으며, 이용료는 없습니다.</p>
    <button class="btn kakao" id="kakao">카카오로 추모관 만들기</button>
    <p class="muted" style="margin-top:20px"><a href="/memorial/">샘플 화면 먼저 보기</a></p></div>`;
  $('#kakao').onclick=()=>sb.auth.signInWithOAuth({provider:'kakao',options:{redirectTo:location.origin+'/memorial/app/'}});
}

async function homePage(){
  const uid=session.user.id;
  const {data:own}=await sb.from('memorials').select('id,name,title,birth_date,death_date,visibility,updated_at').eq('owner_id',uid).order('updated_at',{ascending:false});
  const {data:mem}=await sb.from('memorial_members').select('memorial_id,memorials(id,name,title,birth_date,death_date,visibility)').eq('user_id',uid);
  const list=[...(own||[]),...((mem||[]).map(x=>x.memorials).filter(Boolean))];
  $('#main').innerHTML=`<div class="card hero-login" style="padding:40px 24px">${CROSS}<h1 style="margin-bottom:8px">사랑하는 분의 추모관을 만들어 드립니다</h1>
    <p class="muted" style="max-width:44ch;margin:0 auto 22px">성함과 사진만으로 시작할 수 있습니다. 부고장이 있으면 올려서 한 번에 채울 수도 있습니다.</p>
    <a class="btn" href="#new" style="padding:15px 36px;font-size:17px">추모관 만들기</a></div>
   <h2 style="margin:28px 0 14px">내 추모관</h2>
   ${list.length?'<div class="list">'+list.map(m=>`<div class="card row" style="justify-content:space-between">
     <div><h3 style="margin:0">${esc(m.name)} ${esc(m.title||'')}</h3><div class="muted">${fmtDate(m.birth_date)}${m.death_date?' ~ '+fmtDate(m.death_date):' · 생전 기록'} · ${VIS[m.visibility]}</div></div>
     <div class="row"><a class="btn small ghost" href="#view-${m.id}">보기</a><a class="btn small" href="#edit-${m.id}">편집하기</a></div></div>`).join('')+'</div>'

function fileToB64(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)})}
async function shrinkImage(f){const img=await createImageBitmap(f);const k=Math.min(1,1600/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.85).split(',')[1]}
async function readObit(f){
  if(!f)return;const msg=$('#obit-msg');msg.textContent='부고장을 읽는 중… (10~20초)';
  try{
    let data,media_type;
    if(f.type==='application/pdf'){if(f.size>3e6)throw new Error('PDF가 너무 큽니다(3MB 이하). 사진으로 올려 주세요.');data=await fileToB64(f);media_type='application/pdf'}
    else{data=await shrinkImage(f);media_type='image/jpeg'}
    const j=await api('obituary',{data,media_type});
    const set=(id,v)=>{if(v&&$(id))$(id).value=v};
    set('#f-name',j.name);set('#f-title',j.title);set('#f-birth',/^\d{4}-\d{2}-\d{2}$/.test(j.birth_date||'')?j.birth_date:'');
    set('#f-death',/^\d{4}-\d{2}-\d{2}$/.test(j.death_date||'')?j.death_date:'');set('#f-home',j.hometown);
    set('#f-mourn',j.chief_mourners);set('#f-funeral',j.funeral_info);set('#f-verse',j.verse);set('#f-vref',j.verse_ref);
    document.querySelectorAll('details.opt').forEach(d=>{if(d.querySelector('#f-mourn'))d.open=true});msg.textContent='아래 칸에 채웠습니다. 내용을 확인하고 고친 뒤 맨 아래 저장(만들기)을 눌러 주세요.';toast('부고장 내용을 채웠습니다. 확인 후 저장해 주세요.');
  }catch(e){msg.textContent='';toast('부고장을 읽지 못했습니다: '+e.message)}
}

let mediaRec=null, chunks=[], recStart=0;
async function tabRec(m){
  const {data:recs}=await sb.from('recordings').select('*').eq('memorial_id',m.id).order('created_at');
  const done=new Set((recs||[]).map(r=>r.question));
  const next=QUESTIONS.find(q=>!done.has(q))||'';
  $('#tab').innerHTML=`<div class="card"><h2>질문에 말로 답하기</h2>
    <p class="muted">질문을 고르고 녹음 버튼을 누른 뒤 편하게 이야기하세요. 휴대폰 녹음 파일을 올려도 됩니다.</p>
    <label for="q">질문</label><select id="q">${QUESTIONS.map(q=>`<option ${q===next?'selected':''}>${esc(q)}</option>`).join('')}<option value="__custom">직접 질문 쓰기…</option></select>
    <input id="qc" placeholder="질문을 입력하세요" hidden style="margin-top:8px">
    <div class="row" style="margin-top:14px"><button class="btn" id="recBtn">● 녹음 시작</button><span id="recState" class="muted"></span>
      <label class="btn ghost" style="margin:0;color:var(--accent)">파일 올리기<input type="file" id="upAudio" accept="audio/*" hidden></label></div></div>
    <h2>남긴 녹음 (${(recs||[]).length})</h2><div class="list" id="recList"></div>`;
  $('#q').onchange=()=>{$('#qc').hidden=$('#q').value!=='__custom'};
  const question=()=>$('#q').value==='__custom'?$('#qc').value.trim():$('#q').value;
  async function saveAudio(blob,ext,dur){
    const q=question();if(!q)return toast('질문을 입력해 주세요.');
    const p=`${m.id}/rec-${Date.now()}.${ext}`;
    const {error}=await sb.storage.from('memorial-media').upload(p,blob,{contentType:blob.type||'audio/webm'});if(error)return toast('업로드 실패: '+error.message);
    const {data:row,error:e2}=await sb.from('recordings').insert({memorial_id:m.id,question:q,audio_path:p,duration_sec:dur||null}).select().single();if(e2)return toast(e2.message);
    toast('녹음을 저장했습니다.');
    if(cfg.sttEnabled){try{toast('받아쓰는 중…');await api('transcribe',{recording_id:row.id});toast('받아쓰기를 마쳤습니다.')}catch(e){toast(e.message)}}
    tabRec(m);
  }
  $('#recBtn').onclick=async()=>{
    if(mediaRec&&mediaRec.state==='recording'){mediaRec.stop();return}
    try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];
      mediaRec=new MediaRecorder(stream);mediaRec.ondataavailable=e=>chunks.push(e.data);
      mediaRec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const type=mediaRec.mimeType||'audio/webm';
        const blob=new Blob(chunks,{type});$('#recBtn').textContent='● 녹음 시작';$('#recState').textContent='';
        saveAudio(blob,type.includes('mp4')?'m4a':'webm',Math.round((Date.now()-recStart)/1000))};
      mediaRec.start();recStart=Date.now();$('#recBtn').textContent='■ 녹음 끝내기';$('#recState').innerHTML='<span class="rec"></span> 녹음 중';
    }catch(e){toast('마이크를 사용할 수 없습니다. 브라우저 권한을 확인하거나 파일 올리기를 이용하세요.')}
  };
  $('#upAudio').onchange=e=>{const f=e.target.files[0];if(f)saveAudio(f,(f.name.split('.').pop()||'m4a').toLowerCase(),null)};
  const list=$('#recList');
  for(const r of recs||[]){
    const url=await signed(r.audio_path);
    const d=document.createElement('div');d.className='card';
    d.innerHTML=`<div class="row" style="justify-content:space-between"><b>${esc(r.question)}</b><span class="pill ${r.transcript?'ok':''}">${r.transcript?'받아쓰기 완료':'받아쓰기 전'}</span></div>
      <audio controls preload="none" src="${esc(url)}"></audio>
      <label>받아쓴 내용 (틀린 글자는 고쳐 주세요)</label><textarea>${esc(r.transcript)}</textarea>
      <div class="row" style="margin-top:8px"><button class="btn small" data-a="save">고친 내용 저장</button>${cfg.sttEnabled?'<button class="btn small ghost" data-a="stt">AI로 받아쓰기</button>':''}<button class="btn small danger" data-a="del">삭제</button></div>`;
    d.querySelector('[data-a=save]').onclick=async()=>{const {error}=await sb.from('recordings').update({transcript:d.querySelector('textarea').value}).eq('id',r.id);toast(error?error.message:'저장했습니다.')};
    const stt=d.querySelector('[data-a=stt]');if(stt)stt.onclick=async()=>{stt.disabled=true;stt.textContent='받아쓰는 중…';try{const j=await api('transcribe',{recording_id:r.id});d.querySelector('textarea').value=j.transcript;toast('받아쓰기를 마쳤습니다.')}catch(e){toast(e.message)}stt.disabled=false;stt.textContent='AI로 받아쓰기'};
    d.querySelector('[data-a=del]').onclick=async()=>{if(!d._c){d._c=1;toast('한 번 더 누르면 삭제됩니다.');return}
      await sb.storage.from('memorial-media').remove([r.audio_path]);await sb.from('recordings').delete().eq('id',r.id);tabRec(m)};
    list.appendChild(d);
  }
}

    sv.onclick=async()=>{const {error}=await sb.from('sayings').update({body:d.querySelector('[data-f=body]').value,context:d.querySelector('[data-f=context]').value||null}).eq('id',x.id);toast(error?error.message:'저장했습니다.');if(!error){sv.textContent='저장됨 ✓';setTimeout(()=>sv.textContent='저장',2500)}};
    d.querySelector('[data-a=del]').onclick=async()=>{if(!d._c){d._c=1;toast('한 번 더 누르면 삭제됩니다.');return}await sb.from('sayings').delete().eq('id',x.id);tabSayings(m)};
    $('#sayList').appendChild(d)}
}
async function shrinkForUpload(f,max=2000){
  if(!/^image\/(jpeg|png|webp|heic|heif)/.test(f.type)&&!/\.(jpe?g|png|webp)$/i.test(f.name))return {blob:f,ext:(f.name.split('.').pop()||'jpg').toLowerCase()};
  try{const img=await createImageBitmap(f);const k=Math.min(1,max/Math.max(img.width,img.height));
    if(k===1&&f.size<2.5e6)return {blob:f,ext:(f.name.split('.').pop()||'jpg').toLowerCase()};
    const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.86));return {blob,ext:'jpg'}}catch{return {blob:f,ext:(f.name.split('.').pop()||'jpg').toLowerCase()}}
}

  $('#tab').innerHTML=`<div class="card"><h2>사진</h2><p class="muted">추억이 담긴 사진을 여러 장 한 번에 고를 수 있습니다(장수 제한 없음). <b>사진은 고르는 즉시 저장됩니다.</b> 연도와 설명을 적은 뒤에는 아래 <b>설명 모두 저장</b>을 눌러 주세요.</p>
    <div class="row"><label class="btn" style="margin:0;color:var(--paper)">＋ 사진 고르기<input type="file" id="upPh" accept="image/*" multiple hidden></label><button class="btn ghost" id="saveAllPh">설명 모두 저장</button></div></div><div class="thumbs" id="phList"></div>`;
  $('#upPh').onchange=async e=>{const files=[...e.target.files];

      const {error}=await sb.storage.from('memorial-media').upload(p,blob,{contentType:blob.type||undefined});if(error){toast(error.message);continue}
      await sb.from('photos').insert({memorial_id:m.id,path:p,sort:(ps?.length||0)+i})}
    toast('사진을 올려 저장했습니다. 연도·설명을 적고 [설명 모두 저장]을 눌러 주세요.');tabPhotos(m)};

  for(const p of ps||[]){const url=await signed(p.path);const f=document.createElement('figure');f.dataset.id=p.id;
    f.innerHTML=`<img src="${esc(url)}" alt="${esc(p.caption||'사진')}"><input data-f="year" value="${esc(p.year)}" placeholder="연도" style="margin-top:6px"><input data-f="caption" value="${esc(p.caption)}" placeholder="설명" style="margin-top:6px">
      <div class="row" style="margin-top:6px"><button class="btn small">저장</button><button class="btn small danger">삭제</button></div>`;
    const [s,del]=f.querySelectorAll('button');

    del.onclick=async()=>{if(!f._c){f._c=1;toast('한 번 더 누르면 삭제됩니다.');return}await sb.storage.from('memorial-media').remove([p.path]);await sb.from('photos').delete().eq('id',p.id);tabPhotos(m)};

async function uploadPortrait(id,file){
  const {blob,ext}=await shrinkForUpload(file,1600);const p=`${id}/portrait-${Date.now()}.${ext}`;
  const {error:e1}=await sb.storage.from('memorial-media').upload(p,blob,{upsert:true,contentType:blob.type||undefined});if(e1)throw e1;
  const {error:e2}=await sb.from('memorials').update({portrait_path:p}).eq('id',id);if(e2)throw e2;return p}
function portraitPicker(id,label,onDone){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const url=URL.createObjectURL(f);
    const o=document.createElement('div');o.className='lightbox';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
    o.innerHTML=`<div style="background:var(--paper);color:var(--ink);padding:28px;max-width:420px;width:100%;text-align:center;border:1px solid var(--gold)">
      <h2 style="margin-bottom:16px">이 사진으로 모실까요?</h2>
      <div class="niche" style="margin-bottom:18px"><div class="frame" style="padding:6px"><img class="portrait" src="${url}" alt="" style="width:180px"></div></div>
      <div class="row" style="justify-content:center"><button class="btn" data-a="ok">저장하기</button><button class="btn ghost" data-a="no">다른 사진 고르기</button><button class="btn ghost" data-a="x">취소</button></div></div>`;
    const close=()=>{o.remove();URL.revokeObjectURL(url)};
    o.querySelector('[data-a=x]').onclick=close;o.querySelector('[data-a=no]').onclick=()=>{close();portraitPicker(id,label,onDone)};
    o.querySelector('[data-a=ok]').onclick=async e=>{const b=e.target;b.disabled=true;b.textContent='저장하는 중…';
      try{await uploadPortrait(id,f);close();toast('영정 사진을 저장했습니다.');onDone()}catch(err){b.disabled=false;b.textContent='저장하기';alert('사진을 저장하지 못했습니다: '+err.message)}};
    document.body.appendChild(o)};inp.click()}
function emptyBox(msg,tab,id){return `<div class="notice" style="text-align:center">${msg} <a href="#edit-${id}" onclick="try{sessionStorage.setItem('memTab','${tab}')}catch{}">지금 추가하기 →</a></div>`}
function lightbox(items,i){
  const o=document.createElement('div');o.className='lightbox';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
  const show=()=>{o.innerHTML=`<img src="${esc(items[i].url)}" alt=""><div class="cap">${esc(items[i].cap||'')}</div><button class="close" aria-label="닫기">×</button>${items.length>1?'<button class="nav prev" aria-label="이전">‹</button><button class="nav next" aria-label="다음">›</button>':''}`;
    o.querySelector('.close').onclick=close;if(items.length>1){o.querySelector('.prev').onclick=e=>{e.stopPropagation();i=(i-1+items.length)%items.length;show()};o.querySelector('.next').onclick=e=>{e.stopPropagation();i=(i+1)%items.length;show()}}};
  const close=()=>{o.remove();document.removeEventListener('keydown',key)};
  const key=e=>{if(e.key==='Escape')close();if(e.key==='ArrowLeft'&&items.length>1){i=(i-1+items.length)%items.length;show()}if(e.key==='ArrowRight'&&items.length>1){i=(i+1)%items.length;show()}};
  o.onclick=e=>{if(e.target===o)close()};document.addEventListener('keydown',key);show();document.body.appendChild(o);
}
async function viewPage(id){
  const {data:m}=await sb.from('memorials').select('*').eq('id',id).maybeSingle();

  let canEdit=false;if(session){if(m.owner_id===session.user.id)canEdit=true;else{const {data:mm}=await sb.from('memorial_members').select('role').eq('memorial_id',id).eq('user_id',session.user.id).maybeSingle();canEdit=mm?.role==='editor'}}
  $('#main').innerHTML=`${canEdit?`<div class="row" style="justify-content:flex-end;margin-bottom:12px"><a class="btn ghost small" href="#">← 내 추모관 목록</a><a class="btn small" href="#edit-${id}">✎ 이 추모관 편집하기</a></div>`:''}<div class="room">${['tl','tr','bl','br'].map(k=>CORNER.replace('%s',k)).join('')}${LINTEL.replace('%s','lintel')}<section class="memorial">${CROSS}
     <div class="niche" style="position:relative"><div class="frame${portrait?'':' empty'}">${portrait?`<img class="portrait" src="${esc(portrait)}" alt="${esc(m.name)} 님 영정">`:'<div class="portrait">'+CROSS+'</div>'}</div>${canEdit?`<div style="margin-top:12px"><button class="btn small${portrait?' ghost':''}" id="setPortrait">${portrait?'영정 사진 바꾸기':'＋ 영정 사진 올리기'}</button></div>`:''}</div>
     <div class="eyebrow">${m.death_date?'추 모':'생 애 의 기 록'}</div>
     <h1>${esc(m.name)}${m.title?`<small>${esc(m.title)}</small>`:''}</h1>
     <div class="dates">${fmtDate(m.birth_date)}${m.death_date?' — '+fmtDate(m.death_date):''}${age?` · 향년 ${age}세`:''}</div>
     ${m.hometown?`<div class="muted" style="margin-top:4px">${esc(m.hometown)}</div>`:''}
     ${m.death_date?'<div class="rest">주님의 품 안에서 평안히 쉬고 계십니다</div>':''}
     ${m.verse?`<blockquote class="verse">${esc(m.verse)}${m.verse_ref?`<cite>${esc(m.verse_ref)}</cite>`:''}</blockquote>`:''}
     ${m.intro?`<p class="intro">${esc(m.intro).replace(/\n/g,'<br>')}</p>`:''}
     ${(m.hymn||m.chief_mourners||m.funeral_info)?`<div class="facts">${m.hymn?`<div><b>애송 찬송</b>${esc(m.hymn)}</div>`:''}${m.chief_mourners?`<div><b>상주 · 유족</b>${esc(m.chief_mourners)}</div>`:''}${m.funeral_info?`<div><b>장례 일정</b>${esc(m.funeral_info)}</div>`:''}</div>`:''}
   </section>
   <div class="sec"><h2>생애</h2></div>${(chs||[]).length?'<div id="chs" class="timeline"></div>':(canEdit?emptyBox('아직 확인을 마친 생애의 장이 없습니다.',1,id):'<p class="muted" style="text-align:center">아직 공개된 이야기가 없습니다.</p>')+'<div id="chs" hidden></div>'}
   ${!(ss||[]).filter(x=>x.body).length&&canEdit?`<div class="sec"><h2>남기신 말씀</h2><p class="muted">가족에게 늘 하시던 말씀</p></div>${emptyBox('평소 하시던 말씀을 남겨 보세요.',2,id)}`:''}${(ss||[]).filter(x=>x.body).length?`<div class="sec"><h2>남기신 말씀</h2><p class="muted">가족에게 늘 하시던 말씀</p></div><div class="sayings">${ss.filter(x=>x.body).map(x=>`<div class="saying"><p>${esc(x.body).replace(/\n/g,'<br>')}</p>${x.context?`<div class="ctx">— ${esc(x.context)}</div>`:''}</div>`).join('')}</div>`:''}
   ${!(ps||[]).length&&canEdit?`<div class="sec"><h2>사진</h2></div>${emptyBox('추억이 담긴 사진을 올려 보세요.',3,id)}`:''}${(ps||[]).length?`<div class="sec"><h2>사진</h2><p class="muted">${ps.length}장의 추억</p></div><div class="thumbs" id="phs"></div>`:''}
   ${(recs||[]).length&&cfg.aiEnabled&&session?`<div class="sec"><h2>여쭤보기</h2></div><div class="card"><p class="muted">궁금한 것을 적으면 생전에 남기신 실제 녹음 가운데 가장 가까운 답을 찾아 들려드립니다. 새로 지어낸 말은 없습니다.</p>
     <div class="row"><input id="askq" placeholder="예: 힘드실 때 어떻게 버티셨어요?" style="flex:1"><button class="btn" id="askb">찾기</button></div><div id="aska"></div></div>`:''}
   <div class="sec"><h2>함께한 추억</h2><p class="muted">고인과 함께했던 기억과 사진을 나누어 주세요</p></div><div class="memories" id="mems"></div>
   <div class="sec"><h2>위로의 말</h2><p class="muted">유가족에게 위로의 마음을 전해 주세요</p></div><div class="list" id="gb"></div>
   ${session?`<div class="card" style="margin-top:28px" id="gbform"><div class="seg" role="group"><button type="button" data-k="memory" aria-pressed="true">추억 나누기</button><button type="button" data-k="comfort" aria-pressed="false">위로의 말 남기기</button></div>

     <div id="memonly"><label for="gby">언제의 일인가요 (선택)</label><input id="gby" maxlength="30" placeholder="예: 1998년 여름, 손주 돌잔치 때"></div>
     <label for="gbt" id="gbtl">추억</label><textarea id="gbt" maxlength="2000" placeholder="고인과 함께했던 기억을 들려주세요"></textarea>
     <div id="memphoto"><label for="gbp">사진 (선택)</label><input id="gbp" type="file" accept="image/*"></div>
     <button class="btn" id="gbs" style="margin-top:14px">올리기</button></div>`:`<p class="muted" style="text-align:center;margin-top:24px">로그인하면 추억과 위로의 말을 남길 수 있습니다. <button class="btn small ghost" id="kakao2">카카오로 로그인</button></p>`}${LINTEL.replace('%s','floor')}</div>`;
  if($('#setPortrait'))$('#setPortrait').onclick=()=>portraitPicker(id,'',()=>viewPage(id));
  const chEl=$('#chs');
  for(const c of chs||[]){const r=recMap[c.recording_id];const d=document.createElement('div');d.className='ch';
    d.innerHTML=`<div class="yr">${esc(c.period||'')}</div><h3>${esc(c.title)}</h3><p>${esc(c.body||'').replace(/\n/g,'<br>')}</p>`;
    if(r){const a=document.createElement('audio');a.controls=true;a.preload='none';a.src=await signed(r.audio_path);d.appendChild(a)}
    chEl.appendChild(d)}
  const gallery=[];const phEl=$('#phs');
  for(const p of ps||[]){const url=await signed(p.path);const cap=[p.year,p.caption].filter(Boolean).join(' · ');const i=gallery.push({url,cap})-1;
    const f=document.createElement('figure');f.innerHTML=`<button aria-label="크게 보기"><img loading="lazy" src="${esc(url)}" alt="${esc(p.caption||'추억 사진')}"></button><figcaption class="muted">${esc(cap)}</figcaption>`;

    if(g.kind==='memory'){const d=document.createElement('div');d.className='memory';const url=g.photo_path?await signed(g.photo_path):'';
      d.innerHTML=`${url?`<img loading="lazy" src="${esc(url)}" alt="추억 사진">`:''}<div class="in">${g.memory_when?`<div class="yr">${esc(g.memory_when)}</div>`:''}<p>${esc(g.body).replace(/\n/g,'<br>')}</p><div class="from">${esc(g.author_name)} · ${when}${canDel(g)?' · <a href="#" data-del>삭제</a>':''}</div></div>`;

    else{const d=document.createElement('div');d.className='letter';d.innerHTML=`<p>${esc(g.body).replace(/\n/g,'<br>')}</p><div class="from">${esc(g.author_name)} 드림 · ${when}${canDel(g)?' · <a href="#" data-del>삭제</a>':''}</div>`;gbEl.appendChild(d);var el=d}
    const dl=el.querySelector('[data-del]');if(dl)dl.onclick=async e=>{e.preventDefault();if(!confirm('이 글을 삭제할까요?'))return;if(g.photo_path)await sb.storage.from('memorial-media').remove([g.photo_path]);await sb.from('guestbook').delete().eq('id',g.id);viewPage(id)}}
  if(!memEl.children.length)memEl.outerHTML='<p class="muted" style="text-align:center">아직 나눈 추억이 없습니다. 첫 추억을 남겨 주세요.</p>';
  if(!gbEl.children.length)gbEl.outerHTML='<p class="muted" style="text-align:center">아직 남겨진 위로의 말이 없습니다.</p>';
  if($('#kakao2'))$('#kakao2').onclick=()=>sb.auth.signInWithOAuth({provider:'kakao',options:{redirectTo:location.href}});
  let kind='memory';
  document.querySelectorAll('#gbform .seg button').forEach(b=>b.onclick=()=>{kind=b.dataset.k;document.querySelectorAll('#gbform .seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    const mem=kind==='memory';$('#memonly').hidden=!mem;$('#memphoto').hidden=!mem;$('#gbtl').textContent=mem?'추억':'위로의 말';$('#gbt').placeholder=mem?'고인과 함께했던 기억을 들려주세요':'유가족께 전하고 싶은 위로의 말씀을 적어 주세요'});
  if($('#gbs'))$('#gbs').onclick=async()=>{const body=$('#gbt').value.trim();const hasPhoto=kind==='memory'&&$('#gbp').files[0];if(!body&&!hasPhoto){alert(kind==='memory'?'추억 글을 적거나 사진을 골라 주세요.':'위로의 말을 적어 주세요.');return}const btn=$('#gbs');btn.disabled=true;btn.textContent='올리는 중…';
    let photo_path=null;const f=kind==='memory'&&$('#gbp').files[0];
    if(f){const {blob,ext}=await shrinkForUpload(f);photo_path=`${id}/guest/${session.user.id}/${Date.now()}.${ext}`;
      const {error:e1}=await sb.storage.from('memorial-media').upload(photo_path,blob,{contentType:blob.type||undefined});if(e1){btn.disabled=false;btn.textContent='올리기';alert('사진을 올리지 못했습니다: '+e1.message);return}}
    const {error}=await sb.from('guestbook').insert({memorial_id:id,author_id:session.user.id,author_name:$('#gbn').value.trim()||'익명',body,kind,photo_path,memory_when:kind==='memory'?($('#gby').value.trim()||null):null});btn.disabled=false;btn.textContent='올리기';if(error)alert('올리지 못했습니다: '+error.message);

  if($('#askb'))$('#askb').onclick=async()=>{const q=$('#askq').value.trim();if(!q)return;$('#aska').innerHTML='<p class="muted">찾는 중…</p>';

      if(r){const a=document.createElement('audio');a.controls=true;a.src=await signed(r.audio_path);$('#aska').appendChild(a)}}
    catch(e){$('#aska').innerHTML=`<p class="muted">${esc(e.message)}</p>`}};
}
